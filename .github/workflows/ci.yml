name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The pinned commit of Fabian Jahr's BIP 460 branch of Bitcoin Core.
  BITCOIN_CORE_REPO: fjahr/bitcoin
  BITCOIN_CORE_REV: 07addd3748f4bb090b38835925a7d532e3190c27

jobs:
  check:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  regtest:
    name: full-aggregation payjoin on regtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the Bitcoin Core build
        id: core-cache
        uses: actions/cache@v4
        with:
          path: bitcoin-core/build/bin
          key: bitcoin-core-${{ env.BITCOIN_CORE_REV }}-${{ runner.os }}
      - name: Build Bitcoin Core with BIP 460
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libevent-dev libboost-dev libsqlite3-dev
          git init -q bitcoin-core
          git -C bitcoin-core fetch --depth 1 "https://github.com/$BITCOIN_CORE_REPO" "$BITCOIN_CORE_REV"
          git -C bitcoin-core checkout -q FETCH_HEAD
          cmake -S bitcoin-core -B bitcoin-core/build -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DBUILD_GUI=OFF \
            -DBUILD_FUZZ_BINARY=OFF -DWITH_ZMQ=OFF -DBUILD_TX=OFF -DBUILD_UTIL=OFF -DBUILD_WALLET_TOOL=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build bitcoin-core/build -j"$(nproc)" --target bitcoind bitcoin-cli
      - name: Run the round trip
        env:
          BITCOIND_EXE: ${{ github.workspace }}/bitcoin-core/build/bin/bitcoind
        run: cargo test --test regtest -- --include-ignored
